name: Validate PM Skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  workflow:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_package.py
      - run: python -m unittest discover -s tests -v
