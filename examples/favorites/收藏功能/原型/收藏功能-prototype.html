<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程收藏 · 交互示例</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f2f6;color:#272338;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}nav{max-width:375px;margin:12px auto;display:flex;gap:8px;padding:0 16px}a{color:#594694}button{font:inherit;cursor:pointer;border:1px solid #d8d1e9;background:#fff;color:#594694;border-radius:7px;padding:6px 10px}button:focus-visible,a:focus-visible{outline:2px solid #7158b0;outline-offset:3px}.device{width:min(375px,100%);min-height:650px;margin:auto;background:#fff;padding:24px 20px}h1{font-size:26px;margin:4px 0}small,.muted{color:#716b7f}article{margin:16px 0;padding:16px;border:1px solid #e5e0ed;border-radius:12px}h2{font-size:17px;margin:0 0 5px}article p{font-size:13px;color:#716b7f}#notice{max-width:375px;min-height:24px;margin:auto;padding:0 16px;color:#645085}header{max-width:375px;margin:12px auto;padding:0 16px;font-size:12px;color:#777}[hidden]{display:none!important}body.tiled .device[hidden]{display:block!important}body.tiled .device{margin:20px auto}.empty{padding:64px 0;text-align:center}.bottom{max-width:375px;margin:16px auto;display:flex;flex-wrap:wrap;gap:8px;padding:0 16px}
</style></head><body>
<header>交互示例 · 数据仅存当前页面，刷新后重置</header><nav aria-label="页面导航"><a href="#all">全部课程</a><a href="#favorites">我的收藏</a></nav><div id="notice" role="status" aria-live="polite"></div>
<section class="device" id="all" data-export-name="课程列表"><small>COURSES</small><h1>选一门想学的课</h1><p class="muted">点击收藏后，可在“我的收藏”中查看。</p><div id="all-courses"></div></section>
<section class="device" id="favorites" data-export-name="我的收藏" hidden><small>FAVORITES</small><h1>我的收藏</h1><div id="empty" class="empty"><strong>还没有收藏</strong><p class="muted">回到课程列表，收藏感兴趣的课程。</p><a href="#all">浏览课程</a></div><div id="favorite-courses"></div></section>
<div class="bottom"><button id="mode" type="button">平铺预览</button><button id="fail" type="button">模拟下次操作失败</button><button id="export" type="button">导出 PNG</button></div>
<script>
'use strict';const courses=[{id:1,title:'产品需求分析',detail:'示例课程 · 4节'},{id:2,title:'交互设计入门',detail:'示例课程 · 6节'},{id:3,title:'数据指标与复盘',detail:'示例课程 · 5节'}];const saved=new Set();let fail=false;
function route(){let page=location.hash.slice(1);if(!['all','favorites'].includes(page)){page='all';history.replaceState(null,'','#all')}document.querySelectorAll('.device').forEach(el=>el.hidden=el.id!==page);render()}
function render(){for(const [id,items]of [['all-courses',courses],['favorite-courses',courses.filter(c=>saved.has(c.id))]]){const target=document.getElementById(id);target.replaceChildren();for(const course of items){const card=document.createElement('article');const title=document.createElement('h2');title.textContent=course.title;const detail=document.createElement('p');detail.textContent=course.detail;const button=document.createElement('button');button.type='button';button.textContent=saved.has(course.id)?'取消收藏':'收藏';button.setAttribute('aria-label',button.textContent+' '+course.title);button.onclick=()=>{if(fail){fail=false;document.getElementById('notice').textContent='模拟网络失败，收藏状态未改变，请重试。';return}if(saved.has(course.id))saved.delete(course.id);else saved.add(course.id);document.getElementById('notice').textContent='收藏状态已更新（演示）。';render()};card.append(title,detail,button);target.append(card)}}document.getElementById('empty').hidden=saved.size>0}
document.getElementById('mode').onclick=function(){const tiled=document.body.classList.toggle('tiled');this.textContent=tiled?'单页预览':'平铺预览'};
document.getElementById('fail').onclick=()=>{fail=true;document.getElementById('notice').textContent='下次操作将模拟失败，再次操作即可重试。'};
document.getElementById('export').onclick=async function(){try{if(!window.exportPrototypeViaServer){await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='../../scripts/prototype-export-client.js';script.onload=resolve;script.onerror=()=>reject(new Error('请先按示例说明初始化并启动导出服务。'));document.head.append(script)})}await window.exportPrototypeViaServer(this)}catch(error){document.getElementById('notice').textContent=error.message}};
window.addEventListener('hashchange',route);route();
</script></body></html>
